name: visiooo
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run ops/init_production_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    image: visiooo:local
    build: .
    restart: unless-stopped
    env_file: app/.env
    environment:
      SERVE_STATIC: 'true'
    ports:
      - '127.0.0.1:${WEB_PORT:-18081}:8000'
    volumes:
      - private_media:/srv/visiooo/app/private-media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host':'visiooo.ru','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
volumes:
  postgres_data:
  private_media:
