<meta name="description" content="{{ seo.description }}">
<meta name="robots" content="{% if seo.indexable %}index,follow{% else %}noindex,nofollow{% endif %}">
<link rel="canonical" href="{{ seo.url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Визитка">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.url }}">
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:alt" content="{{ seo.image_alt }}">
{% if seo.default_image %}<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.image }}">
<meta name="twitter:image:alt" content="{{ seo.image_alt }}">
