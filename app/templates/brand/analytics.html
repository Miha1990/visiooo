{% load static %}{% if analytics.configured %}
<section class="analytics-banner" data-analytics-banner role="region" aria-label="Выбор аналитики" hidden>
  <h2 tabindex="-1">Статистика сайта</h2>
  <p>С вашего согласия Яндекс Метрика собирает статистику посещений. Это необязательно для работы сайта. <a href="/legal/analytics" target="_blank" rel="noopener">Подробнее</a></p>
  <p data-analytics-status role="status" aria-live="polite"></p>
  <div class="analytics-actions"><button type="button" data-analytics-choice="denied">Отклонить</button><button type="button" data-analytics-choice="granted">Разрешить</button></div>
</section>
{{ analytics|json_script:'analytics-config' }}
<script src="{% static 'analytics-consent.js' %}" defer></script>
{% endif %}
