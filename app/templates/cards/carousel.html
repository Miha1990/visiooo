{% load card_tags %}{% gallery_images as slides %}
<section class="card-carousel" aria-label="Фотографии" data-card-carousel data-visible="{{ content.design.carousel.visible|default:1 }}" data-autoplay="{{ content.design.carousel.autoplay|yesno:'true,false' }}" data-interval="{{ content.design.carousel.interval|default:5 }}" style="--slides-visible:{{ content.design.carousel.visible|default:1 }};--slide-height:{{ content.design.carousel.height|default:220 }}px">
{% if content.design.carousel.title %}<h2>{{ content.design.carousel.title }}</h2>{% endif %}<div class="carousel-track" tabindex="0" aria-label="Галерея, можно пролистывать вручную">{% for slide in slides %}<figure class="carousel-slide" data-slide-id="{{ slide.id }}"><img src="{{ slide.url }}" alt="Фотография {{ forloop.counter }} из {{ slides|length }}" loading="lazy"></figure>{% endfor %}</div>
<p class="carousel-empty" {% if slides %}hidden{% endif %}>Добавьте фотографии в карусель</p>
<div class="carousel-controls" {% if not slides %}hidden{% endif %}><button type="button" data-carousel-prev aria-label="Предыдущие фотографии">Назад</button><span data-carousel-status aria-live="polite">1 / {{ slides|length }}</span><button type="button" data-carousel-next aria-label="Следующие фотографии">Далее</button><button type="button" data-carousel-pause {% if not content.design.carousel.autoplay %}hidden{% endif %}>Пауза</button></div>
</section>
