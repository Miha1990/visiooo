{% load card_tags %}{% card_buttons as buttons %}
{% if buttons or preview %}<div class="contact-actions builder-contact-buttons" {% if not buttons %}hidden{% endif %}>
{% for button in buttons %}<a class="builder-contact-button" data-layout-button="{{ button.index }}" href="{{ button.href }}" {% if button.external %}target="_blank" rel="noopener noreferrer"{% endif %}{% if button.download %} download{% if not button.value %} data-local-file{% endif %}{% endif %}><img src="{{ button.icon }}" width="28" height="28" alt=""><span>{{ button.label }}</span></a>{% endfor %}
</div>{% endif %}
