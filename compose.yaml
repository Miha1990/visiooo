services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vizitka
      POSTGRES_USER: vizitka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-vizitka-only}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizitka -d vizitka"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
